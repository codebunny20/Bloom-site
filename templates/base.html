<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bloom — your journey, your pace{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="brand" href="{{ url_for('index') }}" aria-label="Bloom home" title="Bloom home"><span class="brand-mark">✿</span><span class="brand-name">bloom</span></a>
            <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-controls="sidebar" aria-expanded="true" title="Collapse sidebar">‹</button>
        </div>
        <p class="nav-label">YOUR TOOLS</p>
        <nav class="main-nav" aria-label="Main">
            <a class="nav-link{% if active == 'home' %} active{% endif %}" href="{{ url_for('index') }}" aria-label="Home" title="Home"><span>⌂</span><span class="nav-link-label">Home</span></a>
            {% for t in tools %}
            <a class="nav-link{% if active == t.slug %} active{% endif %}" href="{{ url_for('tool_page', slug=t.slug) }}" aria-label="{{ t.name }}" title="{{ t.name }}"><span>{{ t.icon }}</span><span class="nav-link-label">{{ t.name }}</span></a>
            {% endfor %}
            <a class="nav-link{% if active == 'settings' %} active{% endif %}" href="{{ url_for('settings') }}" aria-label="Settings" title="Settings"{% if active == 'settings' %} aria-current="page"{% endif %}><span>⚙</span><span class="nav-link-label">Settings</span></a>
        </nav>
        <div class="sidebar-note">
            <span class="note-sparkle">✦</span>
            <p>Small steps still count.</p>
        </div>
        <div class="privacy-indicator"><span class="privacy-dot"></span>Private — saved only on this device</div>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <span class="date-label" id="today-date"></span>
            <button class="text-button" id="clear-data" type="button">Clear data</button>
        </div>
        {% block content %}{% endblock %}
        <footer class="page-footer">
            <p id="save-status" role="status">Saved on this device.</p>
            <p>Bloom is a companion, not medical advice.</p>
        </footer>
    </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
